services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${PAYFLOW_DB_PASSWORD:?copy .env.example to .env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/payflow
      PAYFLOW_DB_USER: payflow
      PAYFLOW_DB_PASSWORD: ${PAYFLOW_DB_PASSWORD:?copy .env.example to .env first}
      PAYFLOW_DB_POOL_SIZE: ${PAYFLOW_DB_POOL_SIZE:-20}
      PAYFLOW_ADMIN_TOKEN: ${PAYFLOW_ADMIN_TOKEN:?copy .env.example to .env first}
      PAYFLOW_PSP_WEBHOOK_SECRET: ${PAYFLOW_PSP_WEBHOOK_SECRET:?copy .env.example to .env first}
      PAYFLOW_FEE_BPS: ${PAYFLOW_FEE_BPS:-250}
    ports:
      - "${PAYFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
