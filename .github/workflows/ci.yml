name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Spotless, -Werror compilation, the full suite on Testcontainers PostgreSQL 16,
      # the JaCoCo >= 85% line-coverage gate and SpotBugs all run in `verify`.
      - name: mvn verify
        run: mvn -B -ntp clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/benchmark-results.txt

  compose-smoke:
    name: docker compose happy path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Run the smoke test against the container
        run: ./scripts/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  dependency-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The NVD database download is only practical with an API key.
    if: ${{ vars.NVD_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -Psecurity org.owasp:dependency-check-maven:check
